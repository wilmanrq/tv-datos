name: Verificar canales
on:
  schedule:
    - cron: "17 */3 * * *"      # cada 3 horas
  workflow_dispatch: {}          # también se puede lanzar a mano desde la pestaña Actions
permissions:
  contents: write
concurrency:
  group: verificar
  cancel-in-progress: false
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar
        run: python verificar.py
      - name: Publicar verified.json
        run: |
          git config user.name "verificador"
          git config user.email "verificador@users.noreply.github.com"
          git add verified.json l
          git diff --cached --quiet || git commit -m "verificación $(date -u +%F\ %H:%M)"
          git push
